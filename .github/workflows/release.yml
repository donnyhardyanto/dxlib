# Runs GoReleaser when a version tag is pushed. The tag itself is still cut by
# hand, because the order in which dxlib and the downstream consumers that pin
# it are released is a judgement call GoReleaser has no view of: each gitlink
# references a commit that must already exist on origin.
#
# What this automates is the part that is mechanical and was being done by hand:
# building the changelog and publishing the GitHub release. The tag message,
# which carries the consumer-facing warnings, is written by a person and kept --
# `mode: append` in .goreleaser.yaml puts the generated changelog beneath it.
#
# The release is left as a draft, not published: a published release is
# immutable, so the SBOMs could not be attached afterwards (v1.129.0 to
# v1.132.0 carry none for that reason, BUG-001). After this workflow finishes,
# run `agentq sbom dxlib <tag>`: it scans the tag's tree, commits sbom/<tag>/
# on main, uploads dxlib-<version>.cdx.json and dxlib-<version>.spdx.json to
# the draft, writes the scan summary into its notes, publishes it and checks
# both files are on it. Do not publish the draft by hand before that.
#
# The draft made by hand with `gh release create <tag> --draft` is reused only
# when its --title is the tag itself; see use_existing_draft in .goreleaser.yaml
# and "Releasing" in README.md for the whole order.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job writes: GoReleaser fills (or makes) the draft release and
    # uploads the source archives and checksums with the job token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # GoReleaser needs the full history and all tags to build a changelog
          # against the previous release.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
